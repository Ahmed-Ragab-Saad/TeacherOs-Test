name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd_CI_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd_CI_2026!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd_CI_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TeacherOS.slnx

      - name: Build
        run: dotnet build TeacherOS.slnx --configuration Release --no-restore

      - name: Test
        env:
          TEACHEROS_TEST_DB_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=TeacherOS_CI;User Id=sa;Password=YourStrong@Passw0rd_CI_2026!;TrustServerCertificate=true;Encrypt=true;"
        run: dotnet test TeacherOS.slnx --configuration Release --no-build

  release_production:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF Core CLI tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore TeacherOS.slnx

      # Production migrations must follow backward-compatible expand/contract practices
      # so existing application instances remain operational while schema changes are applied.
      - name: Apply EF Core migrations
        shell: pwsh
        env:
          PRODUCTION_DB_CONNECTION_STRING: ${{ secrets.PRODUCTION_DB_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project src/TeacherOS.Infrastructure `
            --startup-project src/TeacherOS.Api `
            --context ApplicationDbContext `
            --connection $env:PRODUCTION_DB_CONNECTION_STRING

      - name: Publish API
        shell: pwsh
        run: |
          dotnet publish src/TeacherOS.Api/TeacherOS.Api.csproj `
            --configuration Release `
            --runtime win-x86 `
            --self-contained false `
            --output .\publish

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path ".\publish\TeacherOS.Api.dll")) {
            throw "Publish output was not created correctly."
          }

          Write-Host "Publish output verified successfully."
          Get-ChildItem ".\publish" | Select-Object Name

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      - name: Verify production health
        shell: pwsh
        run: |
          $endpoints = @(
            "https://teachos.runasp.net/health/live",
            "https://teachos.runasp.net/health/ready"
          )

          $maxAttempts = 18
          $delaySeconds = 5

          foreach ($url in $endpoints) {
            Write-Host "Verifying endpoint: $url"

            $attempt = 1
            $success = $false

            while ($attempt -le $maxAttempts) {
              try {
                $response = Invoke-WebRequest `
                  -Uri $url `
                  -Method Get `
                  -UseBasicParsing `
                  -TimeoutSec 10 `
                  -ErrorAction Stop

                if ($response.StatusCode -eq 200) {
                  Write-Host "Endpoint $url returned HTTP 200 on attempt $attempt"
                  $success = $true
                  break
                }

                Write-Host "Attempt $attempt returned HTTP $($response.StatusCode). Retrying in $delaySeconds seconds..."
              }
              catch {
                Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
                Write-Host "Retrying in $delaySeconds seconds..."
              }

              Start-Sleep -Seconds $delaySeconds
              $attempt++
            }

            if (-not $success) {
              Write-Error "Production health check failed: $url did not return HTTP 200."
              exit 1
            }
          }

          Write-Host "Production health verification completed successfully."
