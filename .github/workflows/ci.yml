name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeacherOS.slnx

      - name: Build
        run: dotnet build TeacherOS.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TeacherOS.slnx --configuration Release --no-build
