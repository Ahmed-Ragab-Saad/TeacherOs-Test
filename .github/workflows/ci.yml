name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Passw0rd_CI_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd_CI_2026!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd_CI_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeacherOS.slnx

      - name: Build
        run: dotnet build TeacherOS.slnx --configuration Release --no-restore

      - name: Test
        env:
          TEACHEROS_TEST_DB_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=TeacherOS_CI;User Id=sa;Password=YourStrong@Passw0rd_CI_2026!;TrustServerCertificate=true;Encrypt=true;"
        run: dotnet test TeacherOS.slnx --configuration Release --no-build
